<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달력</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #8a90a2;
    --line: #e6e8ef;
    --accent: #3b6ef5;
    --accent-soft: #e8eefe;
    --sun: #e5484d;
    --sat: #3b6ef5;
    --memo: #f5a623;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1d2029;
      --text: #e8eaf0;
      --muted: #7d8396;
      --line: #2c303b;
      --accent: #6b8fff;
      --accent-soft: #263055;
      --sun: #ff6b6f;
      --sat: #6b8fff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  h1 small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .nav { display: flex; gap: 6px; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 0;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .dow.sun { color: var(--sun); }
  .dow.sat { color: var(--sat); }
  .day {
    min-height: 92px;
    padding: 6px 8px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .day:nth-child(7n) { border-right: none; }
  .day:hover { background: var(--accent-soft); }
  .day.other { opacity: 0.35; }
  .day .num {
    font-size: 14px;
    font-weight: 600;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
  }
  .day.sun .num, .day.holiday .num { color: var(--sun); }
  .day.sat:not(.holiday) .num { color: var(--sat); }
  .day.today .num { background: var(--accent); color: #fff; }
  .day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tag {
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag.h { color: var(--sun); }
  .tag.m {
    background: var(--accent-soft);
    color: var(--text);
    border-left: 3px solid var(--memo);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .panel {
    margin-top: 16px;
    padding: 16px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 16px; }
  textarea {
    width: 100%;
    min-height: 80px;
    font: inherit;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
  .panel .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (max-width: 520px) {
    .day { min-height: 58px; padding: 4px; }
    .tag { font-size: 9px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹ 이전</button>
      <button id="today">오늘</button>
      <button id="next" aria-label="다음 달">다음 ›</button>
    </div>
  </header>

  <div class="card">
    <div class="grid" id="dow"></div>
    <div class="grid" id="days"></div>
  </div>

  <div class="card panel">
    <h2 id="selTitle"></h2>
    <div id="selHoliday" class="tag h" style="margin-bottom:8px"></div>
    <textarea id="memo" placeholder="이 날짜에 메모를 남겨 보세요"></textarea>
    <div class="row">
      <button id="del">삭제</button>
      <button id="save" class="primary">저장</button>
    </div>
  </div>
</div>

<script>
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];

  // 양력 고정 공휴일
  const FIXED = {
    '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일',
    '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절'
  };
  // 음력 공휴일 (양력 환산)
  const LUNAR = {
    '2025-01-28': '설날 연휴', '2025-01-29': '설날', '2025-01-30': '설날 연휴',
    '2025-05-05': '부처님오신날',
    '2025-10-05': '추석 연휴', '2025-10-06': '추석', '2025-10-07': '추석 연휴',
    '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
    '2026-05-24': '부처님오신날',
    '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴',
    '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴',
    '2027-05-13': '부처님오신날',
    '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴'
  };

  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const holidaysOf = k => [FIXED[k.slice(5)], LUNAR[k]].filter(Boolean);

  // 메모 저장소 (localStorage 사용 불가 시 메모리로 대체)
  let memos = {};
  try { memos = JSON.parse(localStorage.getItem('calendar-memos') || '{}'); } catch (e) {}
  const persist = () => { try { localStorage.setItem('calendar-memos', JSON.stringify(memos)); } catch (e) {} };

  const now = new Date();
  let view = new Date(now.getFullYear(), now.getMonth(), 1);
  let selected = key(now);

  const $ = id => document.getElementById(id);

  $('dow').innerHTML = DOW.map((d, i) =>
    `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');

  function render() {
    const y = view.getFullYear(), m = view.getMonth();
    $('title').innerHTML = `${m + 1}월<small>${y}</small>`;

    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    const weeks = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
    const todayKey = key(now);
    let html = '';

    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = key(d);
      const hol = holidaysOf(k);
      const cls = ['day'];
      if (d.getMonth() !== m) cls.push('other');
      if (d.getDay() === 0) cls.push('sun');
      if (d.getDay() === 6) cls.push('sat');
      if (hol.length) cls.push('holiday');
      if (k === todayKey) cls.push('today');
      if (k === selected) cls.push('selected');

      html += `<div class="${cls.join(' ')}" data-key="${k}">
        <span class="num">${d.getDate()}</span>
        ${hol.map(h => `<span class="tag h">${h}</span>`).join('')}
        ${memos[k] ? `<span class="tag m">${escapeHtml(memos[k].split('\n')[0])}</span>` : ''}
      </div>`;
    }
    $('days').innerHTML = html;
    renderPanel();
  }

  function renderPanel() {
    const [y, mo, d] = selected.split('-').map(Number);
    const date = new Date(y, mo - 1, d);
    $('selTitle').textContent = `${y}년 ${mo}월 ${d}일 (${DOW[date.getDay()]})`;
    $('selHoliday').textContent = holidaysOf(selected).join(', ');
    $('memo').value = memos[selected] || '';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  $('days').addEventListener('click', e => {
    const cell = e.target.closest('.day');
    if (!cell) return;
    selected = cell.dataset.key;
    const [y, mo] = selected.split('-').map(Number);
    if (mo - 1 !== view.getMonth() || y !== view.getFullYear()) view = new Date(y, mo - 1, 1);
    render();
  });

  $('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  $('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
  $('today').onclick = () => { view = new Date(now.getFullYear(), now.getMonth(), 1); selected = key(now); render(); };

  $('save').onclick = () => {
    const v = $('memo').value.trim();
    if (v) memos[selected] = v; else delete memos[selected];
    persist(); render();
  };
  $('del').onclick = () => { delete memos[selected]; persist(); render(); };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
  });

  render();
</script>
</body>
</html>
