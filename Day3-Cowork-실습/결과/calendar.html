<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 달력</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #8a9099;
    --line: #eceef1;
    --hover: #f1f3f6;
    --accent: #3b5bdb;
    --sun: #e03131;
    --sat: #1c7ed6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1b1e23;
      --text: #e8eaed;
      --muted: #7d848e;
      --line: #2a2e35;
      --hover: #262a31;
      --accent: #748ffc;
      --sun: #ff6b6b;
      --sat: #4dabf7;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .calendar {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 28px 22px 24px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-label {
    font-size: 18px;
    font-weight: 600;
  }
  .nav {
    display: flex;
    gap: 6px;
  }
  .nav button {
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav button:hover { background: var(--hover); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 0 10px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .day:hover { background: var(--hover); }
  .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sun { color: var(--sun); }
  .sat { color: var(--sat); }
  .weekday.sun { color: var(--sun); }
  .weekday.sat { color: var(--sat); }
  .day.other { opacity: 0.3; }
  .day.today {
    font-weight: 700;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .day.selected {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .selected-info {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--hover);
    font-size: 15px;
    text-align: center;
    min-height: 48px;
  }
  .selected-info .hint { color: var(--muted); }
  .today-btn {
    display: block;
    margin: 14px auto 0;
    border: none;
    background: none;
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  @media (max-width: 380px) {
    .calendar { padding: 22px 14px 18px; border-radius: 16px; }
    .day { font-size: 14px; border-radius: 10px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
  <main class="calendar">
    <h1>나의 달력</h1>
    <div class="header">
      <div class="month-label" id="monthLabel"></div>
      <div class="nav">
        <button id="prevBtn" aria-label="이전 달">‹</button>
        <button id="nextBtn" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="selected-info" id="selectedInfo"><span class="hint">날짜를 눌러보세요</span></div>
    <button class="today-btn" id="todayBtn">오늘로 이동</button>
  </main>

<script>
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const grid = document.getElementById('grid');
  const monthLabel = document.getElementById('monthLabel');
  const selectedInfo = document.getElementById('selectedInfo');

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selected = null;

  const sameDay = (a, b) => a && b &&
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  function render() {
    monthLabel.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    grid.innerHTML = '';

    WEEKDAYS.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'weekday' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
      el.textContent = w;
      grid.appendChild(el);
    });

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const start = new Date(viewYear, viewMonth, 1 - firstDow);
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
    const cells = Math.ceil((firstDow + lastDate) / 7) * 7;

    for (let i = 0; i < cells; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const btn = document.createElement('button');
      const dow = d.getDay();
      btn.className = 'day';
      if (dow === 0) btn.classList.add('sun');
      if (dow === 6) btn.classList.add('sat');
      if (d.getMonth() !== viewMonth) btn.classList.add('other');
      if (sameDay(d, today)) btn.classList.add('today');
      if (sameDay(d, selected)) btn.classList.add('selected');
      btn.textContent = d.getDate();
      btn.setAttribute('aria-label', formatDate(d));
      btn.addEventListener('click', () => selectDate(d));
      grid.appendChild(btn);
    }
  }

  function formatDate(d) {
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAYS[d.getDay()]}요일`;
  }

  function selectDate(d) {
    selected = d;
    if (d.getMonth() !== viewMonth || d.getFullYear() !== viewYear) {
      viewYear = d.getFullYear();
      viewMonth = d.getMonth();
    }
    selectedInfo.textContent = `선택한 날짜: ${formatDate(d)}` + (sameDay(d, today) ? ' (오늘)' : '');
    render();
  }

  function moveMonth(delta) {
    const d = new Date(viewYear, viewMonth + delta, 1);
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    render();
  }

  document.getElementById('prevBtn').addEventListener('click', () => moveMonth(-1));
  document.getElementById('nextBtn').addEventListener('click', () => moveMonth(1));
  document.getElementById('todayBtn').addEventListener('click', () => {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    selectDate(today);
  });

  render();
</script>
</body>
</html>
